[project]
name = "ampesm"
version = "0.1.0"
description = "Clasificador de peptidos antimicrobianos (AMP vs no-AMP) con embeddings de ESM-2"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Hermoza" }]
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
    "openpyxl==3.1.5",
    "requests==2.32.3",
    "pyyaml==6.0.2",
    "tqdm==4.67.1",
    "biopython==1.84",
    "xgboost==2.1.2",
    "umap-learn==0.5.7",
    "torch==2.5.1",
    "transformers==4.46.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "pre-commit==4.0.1",
    "jupyter==1.1.1",
]

[project.scripts]
ampesm = "ampesm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ampesm"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Los tests importan ampesm desde src sin depender del instalable editable.
# Motivo (P-13): el archivo .pth del editable dejo de procesarse en el entorno
# y los 115 tests pasaron a fallar en la coleccion con "No module named
# ampesm", que parece un error del proyecto y no del entorno. Con esto, un
# entorno a medio instalar no se confunde con codigo roto.
pythonpath = ["src"]
