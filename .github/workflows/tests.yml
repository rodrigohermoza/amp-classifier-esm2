name: tests

# Solo lint y tests unitarios. No se descargan datos ni modelos en CI:
# las fuentes tienen licencias que restringen la redistribucion y los pesos
# de ESM-2 son cientos de MB. Los tests estan disenados para correr sin red.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Tests
        run: uv run pytest -v
